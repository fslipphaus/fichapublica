services:
  - type: web
    name: ficha-publica
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /api/health
    envVars:
      - key: CACHE_TTL_SECONDS
        value: 900
      - key: VOTACOES_LOOKBACK_DAYS
        value: 120
      - key: VOTACOES_SCAN_LIMIT
        value: 36
